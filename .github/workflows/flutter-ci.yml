name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --no-pub --fatal-infos
      - name: Test
        run: flutter test --no-pub --coverage
      - name: Test demo packaging
        run: python3 -m unittest discover -s scripts -p 'test_package_demo.py' -v
      - name: Build browser preview
        run: bash scripts/build_preview.sh
      - name: Store browser build
        uses: actions/upload-artifact@v7
        with:
          name: paul-browser-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Store coverage data
        uses: actions/upload-artifact@v7
        with:
          name: paul-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
