name: paul_demo
description: Flutter implementation of the Profile creation - Test design.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  characters: ^1.4.1
  flutter_svg: ^2.2.3
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  supabase_flutter: 2.18.3
  qr_flutter: 4.1.0
  web: 1.1.2
  crypto: 3.0.8
  http: 1.6.0
  sqlite3: 3.9.1
  path_provider: 2.1.5
  share_plus: 13.3.1
  flutter_contacts: 2.6.0
  app_links: 7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yet_another_json_isolate: 2.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/people/
    - assets/skills/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf

